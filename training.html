<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<title>トレーニング記録</title>
<style>
  :root {
    --bg: #101218;
    --surface: #1a1d27;
    --surface2: #242836;
    --line: #2f3445;
    --text: #eef0f6;
    --muted: #9aa1b5;
    --faint: #5f667a;
    --accent: #ff6a3d;
    --accent-soft: rgba(255, 106, 61, .14);
    --good: #34c78a;
    --good-soft: rgba(52, 199, 138, .10);
    --warn: #f2b33d;
    --radius: 14px;
    --tabh: 62px;
    --toph: 52px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', Meiryo, sans-serif;
    font-size: 16px; line-height: 1.5;
    padding-top: calc(var(--toph) + env(safe-area-inset-top));
    padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 20px);
    -webkit-text-size-adjust: 100%;
  }
  body.has-rest { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 76px); }
  body.noscroll { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  h2 { font-size: 1.15rem; margin-bottom: 12px; }
  h3 { font-size: 1rem; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- top / tab bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    height: calc(var(--toph) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 8px 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(16, 18, 24, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    height: calc(var(--tabh) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: rgba(20, 22, 30, .96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .tab {
    background: none; border: 0; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 600;
  }
  .tab svg, .iconbtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { color: var(--accent); }

  main { max-width: 640px; margin: 0 auto; padding: 12px 16px; }

  /* ---------- basics ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 46px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface2); color: var(--text);
    font-weight: 600; font-size: 15px; white-space: nowrap;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: #ff7b7b; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn.block { width: 100%; }
  .btn.xl { min-height: 60px; font-size: 18px; border-radius: 16px; }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .iconbtn { width: 44px; height: 44px; border: 0; background: none; color: var(--muted); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; }
  .iconbtn:active { background: var(--surface2); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stack > * + * { margin-top: 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chipwrap { display: inline-flex; align-items: center; flex: none; }
  .chipwrap .chip { border-radius: 999px 0 0 999px; }
  .chipwrap .chipx { min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-left: 0; border-radius: 0 999px 999px 0; background: var(--surface); color: var(--faint); }
  .fieldlbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field { margin-bottom: 12px; }
  .field input, .field select, .search, .note, .tin {
    width: 100%; min-height: 46px; padding: 0 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px;
  }
  .field select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .field .check-row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .field .check-row input { width: 22px; height: 22px; min-height: 0; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
  .note { min-height: 80px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
  .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
  .empty p:first-child { color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-size: 14px; font-weight: 600; padding: 4px 0 10px; display: block; margin: 0 auto; }

  /* ---------- today ---------- */
  .datebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .datebar .iconbtn { font-size: 30px; color: var(--text); }
  .datepick { position: relative; display: flex; align-items: center; gap: 8px; font-size: 1.15rem; font-weight: 700; padding: 6px 12px; border-radius: 12px; }
  .datepick em { font-style: normal; font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
  .datepick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .sumgrid .k { font-size: 12px; color: var(--muted); }
  .sumgrid .v { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .sumgrid .v small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .progress { height: 6px; border-radius: 3px; background: var(--surface2); margin-top: 10px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--good); border-radius: 3px; transition: width .3s; }

  .item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: -4px -6px 0 0; }
  .item-title { padding-top: 4px; min-width: 0; }
  .item-title h3 { font-size: 1.1rem; line-height: 1.35; word-break: break-word; }
  .cat { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: var(--surface2); color: var(--muted); margin-bottom: 2px; }
  .prev { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  .item-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .set-grid { display: grid; grid-template-columns: 2.4rem repeat(var(--n), minmax(0, 1fr)) 2.9rem; gap: 6px; align-items: center; }
  .set-head { margin-top: 12px; }
  .set-head span { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }
  .set { padding: 8px 0; border-top: 1px solid var(--line); }
  .set + .set { }
  .set .set-grid + .set-grid { margin-top: 6px; }
  .set-no { font-weight: 800; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .set .lbl { font-size: 11px; color: var(--muted); text-align: center; }
  .in {
    width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 17px; font-weight: 700;
    text-align: center; font-variant-numeric: tabular-nums; padding: 0 2px;
  }
  .in:focus, .field input:focus, .search:focus, .note:focus, .tin:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .in.plan { height: 36px; background: transparent; border-style: dashed; color: var(--muted); font-size: 16px; font-weight: 600; }
  .in.act::placeholder { color: var(--faint); font-weight: 600; }
  .set.done .in.act { border-color: var(--good); background: var(--good-soft); }
  .set.done.under .in.act { border-color: var(--warn); background: rgba(242, 179, 61, .08); }
  .check { width: 100%; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--faint); font-size: 20px; font-weight: 800; }
  .set.done .check { background: var(--good); border-color: var(--good); color: #062014; }
  .set.done.under .check { background: var(--warn); border-color: var(--warn); color: #241800; }
  .x { width: 100%; height: 36px; border: 0; background: none; color: var(--faint); font-size: 20px; border-radius: 10px; }
  .item-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .item-foot .kcal { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { margin: 4px 0 16px; }
  .prevmemo { font-size: 13px; color: var(--warn); margin: -4px 0 8px; }
  .memo-in { display: block; width: 100%; min-height: 40px; margin-top: 10px; padding: 8px 12px; resize: none; line-height: 1.45; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
  .memo-in::placeholder { color: var(--faint); font-size: 14px; }
  .memo-in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .restafter { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px -14px -14px; padding: 10px 14px; background: rgba(61, 139, 255, .12); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); color: #c8dbff; font-size: 14px; }
  .imp-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .imp-row:first-child { border-top: 0; }
  .imp-row .nm { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .imp-row .nm small { font-weight: 600; color: var(--muted); white-space: nowrap; }
  .imp-row .nm small.new { color: var(--warn); }
  .imp-row .sets, .imp-row .memo { font-size: 14px; font-variant-numeric: tabular-nums; }
  .imp-row .memo { color: var(--muted); font-size: 13px; }
  .imp-warn { font-size: 13px; color: var(--warn); margin-top: 8px; }

  /* ---------- modal ---------- */
  #modal { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; }
  #modal[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    animation: up .2s ease-out;
  }
  @keyframes up { from { transform: translateY(30px); opacity: .5; } }
  .search { margin-bottom: 10px; }
  .pickgroup { font-size: 12px; color: var(--muted); font-weight: 700; margin: 12px 0 4px; }
  .pickrow { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 52px; padding: 8px 12px; border: 0; border-radius: 12px; background: var(--surface2); margin-bottom: 6px; text-align: left; }
  .pickrow span { font-weight: 600; }
  .pickrow small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .menu > * + * { margin-top: 8px; }

  /* ---------- rest bar ---------- */
  #restbar {
    position: fixed; left: 12px; right: 12px; z-index: 25;
    bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);
    max-width: 616px; margin: 0 auto;
    background: #1f3b66; border: 1px solid #2d5596; border-radius: 16px; overflow: hidden;
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; min-height: 56px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  #restbar[hidden] { display: none; }
  #restbar .rb-fill { position: absolute; left: 0; bottom: 0; height: 3px; background: #7fb2ff; }
  #restbar .rb-l { font-size: 13px; color: #c8dbff; }
  #restbar .rb-t { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-right: auto; }
  #restbar .btn { background: rgba(255, 255, 255, .1); border-color: transparent; }

  /* ---------- timer ---------- */
  .stepper { display: grid; grid-template-columns: 1fr 48px 74px 28px 48px; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stepper:last-child { border-bottom: 0; }
  .slbl { font-weight: 600; }
  .sbtn { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-size: 22px; font-weight: 700; }
  .tin { text-align: center; font-size: 20px; font-weight: 800; padding: 0; font-variant-numeric: tabular-nums; }
  .sunit { font-size: 13px; color: var(--muted); }
  .total { text-align: center; margin: 4px 0 12px; color: var(--muted); }
  .total b { color: var(--text); font-size: 1.2rem; }

  #timerOverlay {
    position: fixed; inset: 0; z-index: 60; color: #fff;
    display: flex; flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    background: #333; transition: background .25s;
  }
  #timerOverlay[hidden] { display: none; }
  #timerOverlay.ph-prep { background: #b07a10; }
  #timerOverlay.ph-work { background: #d93f20; }
  #timerOverlay.ph-rest { background: #1d62c4; }
  #timerOverlay.ph-setrest { background: #5b3fc0; }
  #timerOverlay.ph-done { background: #17855a; }
  .tov-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; opacity: .9; gap: 12px; }
  .tov-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tov-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .tov-label { font-size: clamp(28px, 9vw, 48px); font-weight: 800; letter-spacing: .05em; }
  .tov-time { font-size: clamp(96px, 34vw, 220px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin: 8px 0; }
  .tov-next { font-size: 16px; opacity: .85; min-height: 24px; }
  .tov-bar { height: 8px; background: rgba(255, 255, 255, .25); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .tov-bar > div { height: 100%; background: #fff; border-radius: 4px; }
  .tov-total { text-align: center; font-size: 14px; opacity: .85; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
  .tov-btns { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; }
  .tbtn { min-height: 60px; border-radius: 16px; border: 0; background: rgba(0, 0, 0, .22); color: #fff; font-size: 16px; font-weight: 700; }
  .tbtn.big { background: rgba(255, 255, 255, .95); color: #222; font-size: 18px; }

  /* ---------- history ---------- */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .monthbar b { font-size: 1.1rem; }
  .monthbar .iconbtn { font-size: 30px; color: var(--text); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1 / 1.05; border: 1px solid transparent; border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal-cell.today { border-color: var(--accent); color: var(--accent); }
  .cal-cell.sel { background: var(--surface2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.done { background: var(--good); }
  .dot.partial { background: var(--warn); }
  .dot.plan { border: 1.5px solid var(--muted); }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); margin: 10px 0 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .hrow { width: 100%; text-align: left; display: block; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .hrow .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hrow .top b { font-size: 15px; }
  .hrow .names { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface2); color: var(--muted); }

  /* ---------- recommendation ---------- */
  .rectypes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .rectype { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px; min-height: 76px; }
  .rectype b { display: block; font-size: 16px; }
  .rectype small { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .rectype.active { border-color: var(--accent); background: var(--accent-soft); }
  .recitem { padding: 12px 0; border-top: 1px solid var(--line); }
  .recitem:first-child { border-top: 0; padding-top: 0; }
  .recitem .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .recitem .nm small { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .recitem .sets { font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .recitem .why { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .recnote { font-size: 13px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.5; }

  /* ---------- stats ---------- */
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { min-height: 38px; border: 0; background: none; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .seg button.active { background: var(--surface2); color: var(--text); }
  .hero .k { font-size: 13px; color: var(--muted); }
  .hero .big { font-size: 2.6rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .hero .big small { font-size: 1rem; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .hero .delta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .kpis .k { font-size: 12px; }
  .kpis .v { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; touch-action: pan-y; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis-t { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .val-t { fill: var(--text); font-size: 12px; font-weight: 700; }
  .chart .bar { fill: var(--accent); }
  .chart .bar.dim { fill: #b65a3d; }
  .chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .chart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .tip { position: absolute; pointer-events: none; background: #f2f3f7; color: #15171e; font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); z-index: 2; }
  .tip b { font-size: 14px; }

<script>
'use strict';

/* =========================================================

   ========================================================= */

}

/* =========================================================

const DEFAULT_EXERCISES = [

  E('squat', 'スクワット', 'strength', '脚', 'reps', { c1: KG, mets: 5, def: { c1: 40, v: 10 } }),
  E('legpress', 'レッグプレス', 'strength', '脚', 'reps', { c1: KG, mets: 5, def: { c1: 80, v: 12 } }),

  E('latpull', 'ラットプルダウン', 'strength', '背中', 'reps', { c1: KG, mets: 4, def: { c1: 35, v: 10 } }),
  E('pullup', '懸垂', 'strength', '背中', 'reps', { mets: 5, def: { v: 6 } }),
  E('ohp', 'ショルダープレス', 'strength', '肩', 'reps', { c1: KG, mets: 4, def: { c1: 10, v: 10 } }),
  E('latraise', 'サイドレイズ', 'strength', '肩', 'reps', { c1: KG, mets: 3.5, def: { c1: 5, v: 12 }, rest: 60 }),
  E('curl', 'アームカール', 'strength', '腕', 'reps', { c1: KG, mets: 3.5, def: { c1: 8, v: 10 }, rest: 60 }),
  E('triceps', 'トライセプスエクステンション', 'strength', '腕', 'reps', { c1: KG, mets: 3.5, def: { c1: 8, v: 10 }, rest: 60 }),
  E('pressdown', 'プレスダウン', 'strength', '腕', 'reps', { c1: KG, mets: 3.5, def: { c1: 20, v: 10 }, rest: 60 }),
  E('bbcurl', 'バーベルカール', 'strength', '腕', 'reps', { c1: KG, mets: 3.5, def: { c1: 20, v: 10 }, rest: 60 }),
  E('seatedrow', 'シーテッドローイング', 'strength', '背中', 'reps', { c1: KG, mets: 4, def: { c1: 30, v: 10 } }),
  E('plank', 'プランク', 'strength', '体幹', 'time', { mets: 3.8, def: { v: 60 }, rest: 45 }),
  E('crunch', 'クランチ', 'strength', '体幹', 'reps', { mets: 3.8, def: { v: 20 }, rest: 45 }),
  E('treadmill', 'トレッドミル', 'cardio', '有酸素', 'time', { tu: 'min', c1: { label: '速度', unit: 'km/h' }, c2: { label: '傾斜', unit: '%' }, mets: 5, calc: 'treadmill', def: { c1: 5.5, c2: 8, v: 1800 } }),
  E('treadmill_d', 'トレッドミル（距離）', 'cardio', '有酸素', 'dist', { c1: { label: '速度', unit: 'km/h' }, c2: { label: '傾斜', unit: '%' }, mets: 9, calc: 'treadmill', def: { c1: 10, c2: 5, v: 400 } }),

  E('run', 'ラン', 'cardio', '有酸素', 'dist', { mets: 9.8, pace: 36, def: { v: 1000 } }),
  E('burpee', 'バーピー', 'hiit', '全身', 'time', { mets: 8, def: { v: 20 } }),
  E('mclimber', 'マウンテンクライマー', 'hiit', '全身', 'time', { mets: 8, def: { v: 20 } }),
  E('jumpsquat', 'ジャンプスクワット', 'hiit', '脚', 'time', { mets: 8, def: { v: 20 } }),
  E('highknee', 'もも上げ（ハイニー）', 'hiit', '全身', 'time', { mets: 8, def: { v: 20 } }),
  E('burpee_r', 'バーピー（回数）', 'hiit', '全身', 'reps', { mets: 8, def: { v: 15 }, rest: 60 }),
  E('kbswing', 'ケトルベルスイング', 'hiit', '全身', 'time', { c1: KG, mets: 9.8, def: { c1: 12, v: 20 } }),
  E('ski', 'スキーエルゴ', 'hyrox', '全身', 'dist', { mets: 7, pace: 28, def: { v: 500 } }),
  E('row', 'ローイング', 'hyrox', '全身', 'dist', { mets: 7, pace: 26, def: { v: 500 } }),
  E('sledpush', 'スレッドプッシュ', 'hyrox', '脚', 'dist', { c1: KG, mets: 8, pace: 100, def: { c1: 50, v: 25 } }),
  E('sledpull', 'スレッドプル', 'hyrox', '背中', 'dist', { c1: KG, mets: 8, pace: 100, def: { c1: 50, v: 25 } }),
  E('bbj', 'バーピーブロードジャンプ', 'hyrox', '全身', 'dist', { mets: 8, pace: 120, def: { v: 40 } }),
  E('farmers', 'ファーマーズキャリー', 'hyrox', '全身', 'dist', { c1: KG, mets: 6, pace: 60, def: { c1: 16, v: 100 } }),
  E('sblunge', 'サンドバッグランジ', 'hyrox', '脚', 'dist', { c1: KG, mets: 6, pace: 90, def: { c1: 10, v: 50 } }),
  E('wallball', 'ウォールボール', 'hyrox', '全身', 'reps', { c1: KG, mets: 6, def: { c1: 6, v: 30 } }),
];
const TIMER_PRESETS = [
  { name: 'タバタ 20/10×8', prep: 10, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60 },
  { name: '30/30×10', prep: 10, work: 30, rest: 30, rounds: 10, sets: 1, setRest: 60 },
  { name: '40/20×10', prep: 10, work: 40, rest: 20, rounds: 10, sets: 1, setRest: 60 },
  { name: '45/15×8', prep: 10, work: 45, rest: 15, rounds: 8, sets: 1, setRest: 60 },
  { name: 'タバタ×3セット', prep: 10, work: 20, rest: 10, rounds: 8, sets: 3, setRest: 60 },

/* =========================================================

   ========================================================= */
const KEY = 'trainingApp.v1';
function fresh() {
  return {
    version: 2,
    removedDefaults: [],

    sessions: [],
    settings: {
      weights: [], secPerRep: 3, volume: 0.7, vibrate: true,

}
function migrate(d) {
  const f = fresh();
  d.settings = { ...f.settings, ...(d.settings || {}) };
  d.settings.timer = { ...f.settings.timer, ...(d.settings.timer || {}) };
  d.settings.weights = d.settings.weights || [];
  d.settings.presets = d.settings.presets || [];
  d.sessions = d.sessions || [];
  d.exercises = d.exercises || f.exercises;

  for (const def of DEFAULT_EXERCISES) {
    if (!d.exercises.some(e => e.id === def.id) && !d.removedDefaults.includes(def.id)) d.exercises.push(JSON.parse(JSON.stringify(def)));
  }
  if ((d.version || 1) < 2) {
    const bike = d.exercises.find(e => e.id === 'bike');

  }

}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));

  } catch (e) { /* 壊れたデータは新規扱い */ }
  return fresh();
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('保存に失敗しました（容量不足の可能性）'); }
}

/* =========================================================
   データ操作ヘルパー
   ========================================================= */
const exById = id => db.exercises.find(e => e.id === id);
const sessionOf = date => db.sessions.find(s => s.date === date);
function ensureSession(date) {
  let s = sessionOf(date);
  if (!s) { s = { id: uid(), date, note: '', items: [] }; db.sessions.push(s); }
  return s;
}
function findItem(id) { return sessionOf(state.date)?.items.find(i => i.id === id); }
const actualVals = s => ({ c1: s.a?.c1 ?? s.p.c1, c2: s.a?.c2 ?? s.p.c2, v: s.a?.v ?? s.p.v });
function isUnder(s) {
  if (!s.done) return false;
  const a = actualVals(s);
  return (s.p.v != null && a.v != null && a.v < s.p.v) || (s.p.c1 != null && a.c1 != null && a.c1 < s.p.c1);
}
function sessionStatus(s) {
  const sets = s.items.flatMap(i => i.sets);
  if (!sets.length) return 'empty';

  return d === 0 ? 'plan' : d === sets.length ? 'done' : 'partial';
}
const STATUS_LABEL = { plan: '計画', partial: '途中', done: '完了', empty: '' };

/** 指定日より前の、その種目の実施履歴（新しい順） */
function historyOf(exId, beforeDate) {
  const out = [];
  for (const s of db.sessions) {
    if (s.date >= beforeDate) continue;
    for (const it of s.items) if (it.exId === exId && it.sets.some(x => x.done)) out.push({ date: s.date, item: it });
  }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
const lastDoneDate = (exId, date) => historyOf(exId, date)[0]?.date || '';
function itemSuccess(item) {
  return item.sets.length > 0 && item.sets.every(s => {
    if (!s.done) return false;
    const a = actualVals(s);
    return (a.v ?? 0) >= (s.p.v ?? 0) && (s.p.c1 == null || (a.c1 ?? 0) >= s.p.c1);
  });
}

/* ---------- 単位と表示 ---------- */
const vUnit = ex => ex.measure === 'reps' ? '回' : ex.measure === 'dist' ? 'm' : (ex.tu === 'min' ? '分' : '秒');
const isMin = ex => ex.measure === 'time' && ex.tu === 'min';
const toIn = (ex, v) => v == null ? '' : String(isMin(ex) ? r2(v / 60) : r2(v));
const fromIn = (ex, x) => isMin(ex) ? Math.round(x * 60) : x;
function fmtV(ex, v) {
  if (v == null) return '–';
  if (ex.measure === 'reps') return `${r2(v)}回`;
  if (ex.measure === 'dist') return v >= 1000 ? `${r2(v / 1000)}km` : `${r2(v)}m`;
  return fmtDur(v);
}
function condStr(ex, vals) {
  const p = [];
  if (ex.c1 && vals.c1 != null) p.push(vals.c1 === 0 && ex.c1.unit === 'kg' ? '自重' : `${r2(vals.c1)}${ex.c1.unit}`);
  if (ex.c2 && vals.c2 != null) p.push(`${ex.c2.label}${r2(vals.c2)}${ex.c2.unit}`);
  return p.join(' ');
}
function fmtSets(ex, sets, actual) {
  const list = sets.filter(s => !actual || s.done).map(s => actual ? actualVals(s) : s.p);
  if (!list.length) return '';
  const conds = list.map(v => condStr(ex, v));
  if (conds.every(c => c === conds[0])) {
    const vs = list.map(v => fmtV(ex, v.v));
    const body = vs.length > 1 && vs.every(x => x === vs[0]) ? `${vs[0]}×${vs.length}` : vs.join(' / ');
    return (conds[0] ? conds[0] + ' · ' : '') + body;
  }
  return list.map((v, i) => `${conds[i]} ${fmtV(ex, v.v)}`.trim()).join(', ');
}

/* =========================================================
   カロリー計算
   kcal = METs × 体重(kg) × 時間(h) × 1.05
   ========================================================= */
function weightOn(date) {
  const ws = [...db.settings.weights].sort((a, b) => a.date.localeCompare(b.date));
  if (!ws.length) return 60;
  let w = ws[0].kg;
  for (const x of ws) if (x.date <= date) w = x.kg;

}
const hasWeight = () => db.settings.weights.length > 0;
function setKcal(ex, rest, vals, kg) {
  const v = +vals?.v;

  // 回数種目：動作時間＋セット間休憩をまとめて種目METsで計算（筋トレのMETsは休憩込みの平均値のため）
  if (ex.measure === 'reps') return k(ex.mets, v * db.settings.secPerRep + rest);

/* ---------- テキストから取り込み ----------
   例）
     ベンチプレス        ← 種目名の行
     60×10              ← 重さ×回数（×セット数も可）。後ろの文字はメモ
     80×6 足上げ
     1. トレッドミル走 400m（傾斜12.5、スピード12.5）  ← 1行で種目・量・条件
     ーー（レスト5分）ーー  ← 直前の種目の後のレスト
*/
const SYN = [['バービー', 'バーピー'], ['スピード', '速度'], ['レベル', '負荷'], ['ロードバイク', 'バイク'], ['エアロバイク', 'バイク'], ['ケーブル', '']];

const applySyn = t => SYN.reduce((acc, [a, b]) => acc.split(normTxt(a)).join(normTxt(b)), t);

function findExercise(name, measure) {
  let q = baseName(name);
  const cands = db.exercises.map(e => ({ e, b: baseName(e.name) }));
  const pick = qq => {
    let m = cands.filter(c => c.b === qq);
    if (!m.length) m = cands.filter(c => c.b.length >= 2 && qq.length >= 2 && (qq.includes(c.b) || c.b.includes(qq)));
    m = m.filter(c => c.e.measure === measure);
    return m.sort((a, b) => (b.b === qq) - (a.b === qq) || b.b.length - a.b.length)[0]?.e || null;
  };
  return pick(q) || (q.endsWith('走') ? pick(q.slice(0, -1)) : null);
}
function parseMenuText(text) {

  const setRe = new RegExp(`^${N}\\s*(?:kg)?\\s*[×x*✕]\\s*${N}\\s*(?:回|reps?)?(?:\\s*[×x*✕]\\s*${N}\\s*(?:セット|sets?)?)?[.。]?\\s*(.*)$`, 'i');
  const bwRe = new RegExp(`^(?:自重\\s*[×x*✕]?\\s*)?${N}\\s*回(?:\\s*[×x*✕]\\s*${N}\\s*(?:セット|sets?)?)?[.。]?\\s*(.*)$`, 'i');
  const restRe = /^[ー\-ｰ―—=~〜_\s(]*(?:レスト|休憩|インターバル|rest)[^\d]*(\d+(?:\.\d+)?)\s*(分|秒|min|s)/i;
  const out = [], skipped = [];
  let cur = null;
  for (const raw of text.normalize('NFKC').split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || /^[ー\-ｰ―—=~〜_.\s]+$/.test(line)) continue;
    const rm = line.match(restRe);
    if (rm) {
      if (out.length) out[out.length - 1].restAfter = Math.round(parseFloat(rm[1]) * (/分|min/i.test(rm[2]) ? 60 : 1));
      continue;
    }
    line = line.replace(/^(?:\d+[.)]|[・•●○◯▶►*\-])\s+/, '').trim();
    let m = line.match(setRe);
    if (m && cur) {
      const n = Math.min(20, Math.max(1, parseInt(m[3] || '1', 10)));
      for (let i = 0; i < n; i++) cur.sets.push({ c1: parseFloat(m[1]), v: parseFloat(m[2]) });
      if (m[4].trim()) cur.memos.push(`${cur.sets.length}セット目 ${m[4].trim()}`);
      continue;
    }
    m = line.match(bwRe);
    if (m && cur) {
      const n = Math.min(20, Math.max(1, parseInt(m[2] || '1', 10)));
      for (let i = 0; i < n; i++) cur.sets.push({ c1: null, v: parseFloat(m[1]) });
      if (m[3].trim()) cur.memos.push(`${cur.sets.length}セット目 ${m[3].trim()}`);
      continue;
    }
    // 種目の行
    const [body, ...arrow] = line.split(/←|⇐|<-/);
    const conds = [];
    let rest = body.replace(/\(([^)]*)\)/g, (_, c) => { conds.push(c); return ' '; });
    const am = rest.match(/(\d+(?:\.\d+)?)\s*(km|min|reps?|m|回|分|秒)(?![a-z])/i);
    let name = am ? rest.slice(0, am.index) : rest;
    name = name.replace(/[:：]\s*$/, '').trim();
    if (!name) { skipped.push(raw.trim()); continue; }
    cur = {
      name, amount: am ? parseFloat(am[1]) : null, unit: am ? am[2].toLowerCase() : null,
      tokens: conds.flatMap(c => c.split(/[、,/]/)).map(t => t.trim()).filter(Boolean),
      memos: arrow.length ? [arrow.join(' ').trim()] : [], sets: [], restAfter: 0, raw: raw.trim(),

  }

}
function buildImport(text) {
  const { entries, skipped } = parseMenuText(text);
  const plan = [], newByName = {};
  for (const p of entries) {
    if (!p.sets.length && p.amount == null) { skipped.push(p.raw); continue; }
    const measure = p.sets.length ? 'reps' : (UNIT_MEASURE[p.unit] || 'reps');
    let ex = findExercise(p.name, measure), isNew = false;
    const tok = p.tokens.map(t => {
      const m = t.match(/^(.*?)(\d+(?:\.\d+)?)\s*([a-z%]*)(.*)$/i);
      return m ? { t, label: applySyn(normTxt(m[1].replace(/で\s*$/, ''))), rawLabel: m[1].replace(/で\s*$/, '').trim(), num: parseFloat(m[2]), unit: m[3].toLowerCase(), tail: m[4].trim() } : { t };
    });
    if (!ex) {

      ex = newByName[key];
      if (!ex) {
        // 見つからない種目は新しく作る
        const weighted = p.sets.some(s => s.c1 != null) || tok.some(x => x.unit === 'kg');
        const cs = weighted ? [KG] : tok.filter(x => x.num != null).slice(0, 2).map(x => ({ label: x.rawLabel || '条件', unit: x.unit }));
        ex = E(uid(), p.name, measure === 'reps' && weighted ? 'strength' : measure === 'reps' ? 'hiit' : 'cardio', '全身', measure,
          { c1: cs[0] || null, c2: cs[1] || null, tu: measure === 'time' && p.unit !== '秒' ? 'min' : 'sec', mets: weighted ? 4 : 6, pace: measure === 'dist' ? 40 : null, rest: weighted ? 90 : 0 });
        newByName[key] = ex; isNew = true;
      }
    }
    let sets;
    if (p.sets.length) sets = p.sets.map(x => ({ c1: ex.c1 ? x.c1 : null, c2: null, v: x.v }));
    else {
      const mul = p.unit === 'km' ? 1000 : (p.unit === '分' || p.unit === 'min') ? 60 : 1;
      sets = [{ c1: null, c2: null, v: Math.round(p.amount * mul * 100) / 100 }];

    const memo = [...p.memos];
    for (const x of tok) {
      if (x.num == null) { memo.push(x.t); continue; }
      const f = ['c1', 'c2'].find(k => {

        if (x.unit && normTxt(c.unit) === x.unit) return true;
        const cl = applySyn(normTxt(c.label));
        return !!x.label && !!cl && (x.label.includes(cl) || cl.includes(x.label));

      if (f) { sets.forEach(st => { if (st[f] == null) st[f] = x.num; }); if (x.tail) memo.push(x.t); }

    }
    plan.push({ ex, isNew: isNew || !db.exercises.includes(ex), sets, memo: memo.join(' / '), restAfter: p.restAfter });
  }

}

      reason = `${pt} を全セット達成 → 各セット +${incs.join('〜')}${ex.c1.unit}`;

function recStrength(date) {

  const recent = new Set();
  for (const s of db.sessions) {
    if (s.date < addDays(date, -2) || s.date >= date) continue;
    for (const it of s.items) { const ex = exById(it.exId); if (ex?.cat === 'strength' && it.sets.some(x => x.done)) recent.add(ex.part); }
  }

    .sort((a, b) => a.k.localeCompare(b.k) || a.r - b.r).slice(0, 4).map(x => x.p);

function dayAgg() {

    for (const it of s.items) {
      const ex = exById(it.exId);
      if (!ex) continue;
      const k = itemKcal(it, s.date, 'actual');
      a.kcal += k; a.cat[ex.cat] = (a.cat[ex.cat] || 0) + k;

}

}

function barChart(wrap, data, fmt) {
  const W = wrap.clientWidth || 320, H = 190, L = 44, R = 4, T = 22, B = 24;
  const max = niceMax(Math.max(...data.map(d => d.value)));
  const pw = W - L - R, ph = H - T - B, bw = pw / data.length, w = Math.min(34, bw - 6);
  const y = v => T + ph - v / max * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(data.map(d => `${d.label} ${fmt(d.value)}`).join('、'))}">`;
  [0, max / 2, max].forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-t" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${nfmt(t)}</text>`; });
  data.forEach((d, i) => {
    const x = L + i * bw + (bw - w) / 2, top = y(d.value), h = T + ph - top;
    if (h > 0.5) {
      const r = Math.min(4, w / 2, h);
      s += `<path class="bar ${i === data.length - 1 ? '' : 'dim'}" d="M${x},${T + ph} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${T + ph} Z"/>`;
    }
    const every = bw < 44 ? 2 : 1;
    if ((data.length - 1 - i) % every === 0) s += `<text class="axis-t" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  const last = data[data.length - 1];
  s += `<text class="val-t" x="${L + (data.length - 1) * bw + bw / 2}" y="${y(last.value) - 6}" text-anchor="middle">${nfmt(last.value)}</text>`;
  s += '</svg>';
  wrap.innerHTML = s + `<details class="tbl"><summary>表で見る</summary><table><tr><th>期間</th><th>kcal</th></tr>${data.map(d => `<tr><td>${esc(d.label)}</td><td>${nfmt(d.value)}</td></tr>`).join('')}</table></details>`;
  chartTip(wrap, wrap.querySelector('svg'), px => {
    const i = Math.floor((px - L) / bw);
    if (i < 0 || i >= data.length) return null;
    return { x: L + i * bw + bw / 2, y: y(data[i].value), html: `${esc(data[i].tip)}<br><b>${fmt(data[i].value)}</b>` };
  });
}
function lineChart(wrap, pts, yLabel, fmt) {
  const W = wrap.clientWidth || 320, H = 180, L = 44, R = 14, T = 20, B = 24;
  const vals = pts.map(p => p.y), hi = niceMax(Math.max(...vals) * 1.05);
  let lo = Math.min(...vals) * 0.8; lo = lo < hi * 0.2 ? 0 : Math.floor(lo / (hi / 10)) * (hi / 10);
  const pw = W - L - R, ph = H - T - B;
  const x = i => pts.length === 1 ? L + pw / 2 : L + i / (pts.length - 1) * pw;
  const y = v => T + ph - (v - lo) / (hi - lo || 1) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(yLabel)}の推移">`;
  [lo, (lo + hi) / 2, hi].forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-t" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${r2(t)}</text>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" style="display:none"/>`;
  if (pts.length > 1) s += `<path class="ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.y)}`).join(' ')}"/>`;
  pts.forEach((p, i) => { s += `<circle class="pt" cx="${x(i)}" cy="${y(p.y)}" r="5"/>`; });
  s += `<text class="axis-t" x="${x(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtDate(pts[0].date)}</text>`;
  if (pts.length > 1) s += `<text class="axis-t" x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>`;
  s += '</svg>';
  wrap.innerHTML = `<div class="small muted" style="margin-bottom:4px">${esc(yLabel)}</div>` + s;
  chartTip(wrap, wrap.querySelector('svg'), px => {
    let bi = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(x(i) - px); if (d < bd) { bd = d; bi = i; } });
    const p = pts[bi];
    return { x: x(bi), y: y(p.y), html: `${fmtDate(p.date)}<br><b>${fmt(p.y)}</b>${p.sub ? '<br>' + esc(p.sub) : ''}` };
  });
}

const TSTEP = [['prep', '準備', 5, '秒', 0], ['work', '運動', 5, '秒', 1], ['rest', '休憩', 5, '秒', 0], ['rounds', 'ラウンド', 1, '回', 1], ['sets', 'セット', 1, '回', 1], ['setRest', 'セット間', 10, '秒', 0]];
function timerPhases(c) {
  const ph = [];
  if (c.prep > 0) ph.push({ type: 'prep', dur: c.prep });
  for (let s = 1; s <= c.sets; s++) {
    for (let r = 1; r <= c.rounds; r++) {
      ph.push({ type: 'work', dur: c.work, round: r, rounds: c.rounds, set: s, sets: c.sets });
      if (c.rest > 0 && r < c.rounds) ph.push({ type: 'rest', dur: c.rest, round: r, rounds: c.rounds, set: s, sets: c.sets });
    }
    if (s < c.sets && c.setRest > 0) ph.push({ type: 'setrest', dur: c.setRest, set: s, sets: c.sets });
  }
  return ph;
}
const timerTotal = c => timerPhases(c).reduce((t, p) => t + p.dur, 0);

const TM = { phases: [], i: 0, endAt: 0, left: 0, paused: false, iv: null, opts: {}, completed: 0, lastCount: null, finished: false };
function startTimer(phases, opts = {}) {
  phases = phases.filter(p => p.dur > 0);
  if (!phases.some(p => p.type === 'work')) { toast('運動時間を設定してください'); return; }
  unlockAudio(); stopRest(); lockScreen();
  Object.assign(TM, { phases, i: 0, opts, completed: 0, paused: false, finished: false, lastCount: null, endAt: Date.now() + phases[0].dur * 1000 });
  const ov = $('#timerOverlay');
  ov.innerHTML = `
    <div class="tov-top"><span id="tvTitle"></span><span id="tvRound"></span></div>
    <div class="tov-main"><div class="tov-label" id="tvLabel"></div><div class="tov-time" id="tvTime">0:00</div><div class="tov-next" id="tvNext"></div></div>
    <div class="tov-bar"><div id="tvBar"></div></div>
    <div class="tov-total" id="tvTotal"></div>
    <div class="tov-btns" id="tvBtns">
      <button class="tbtn" data-action="tStop">終了</button>
      <button class="tbtn big" data-action="tPause" id="tvPause">一時停止</button>
      <button class="tbtn" data-action="tSkip">スキップ</button>
    </div>`;
  ov.hidden = false;
  document.body.classList.add('noscroll');
  phaseCue(phases[0]);
  paintPhase();
  clearInterval(TM.iv);
  TM.iv = setInterval(tick, 100);
  tick();
}
const PH_LABEL = { prep: '準備', work: '運動', rest: '休憩', setrest: 'セット間休憩' };
function phaseCue(p) {
  if (p.type === 'work') { SFX.work(); vibrate([200, 80, 200]); }
  else if (p.type !== 'prep') { SFX.rest(); vibrate(350); }
}
function paintPhase() {
  const p = TM.phases[TM.i], nx = TM.phases[TM.i + 1];
  const ov = $('#timerOverlay');
  ov.className = `ph-${p.type}`;
  $('#tvTitle').textContent = TM.opts.title || 'インターバル';
  $('#tvRound').textContent = p.round ? `ラウンド ${p.round}/${p.rounds}${p.sets > 1 ? `　セット ${p.set}/${p.sets}` : ''}` : (p.sets > 1 ? `セット ${p.set}/${p.sets}` : '');
  $('#tvLabel').textContent = p.type === 'work' && TM.opts.workLabel ? TM.opts.workLabel(p) : PH_LABEL[p.type];
  $('#tvNext').textContent = nx ? `次：${nx.type === 'work' && TM.opts.workLabel ? TM.opts.workLabel(nx) : PH_LABEL[nx.type]} ${fmtDur(nx.dur)}` : '次：終了';
}
function tick() {
  if (TM.paused || TM.finished || !TM.phases.length) return;
  const now = Date.now();
  let advanced = false;
  while (now >= TM.endAt) {
    if (TM.phases[TM.i].type === 'work') TM.completed++;
    TM.i++;
    if (TM.i >= TM.phases.length) { finishTimer(); return; }
    TM.endAt += TM.phases[TM.i].dur * 1000;
    advanced = true;
  }
  const p = TM.phases[TM.i];
  if (advanced) { TM.lastCount = null; phaseCue(p); paintPhase(); }
  const left = (TM.endAt - now) / 1000, c = Math.ceil(left);
  if (c <= 3 && c >= 1 && c !== TM.lastCount && p.dur >= 4) { TM.lastCount = c; if (!advanced) SFX.count(); }
  paintTime(left);
}
function paintTime(left) {
  const p = TM.phases[TM.i];
  $('#tvTime').textContent = fmtClock(left);
  $('#tvBar').style.width = `${Math.min(100, (p.dur - left) / p.dur * 100)}%`;
  const rest = TM.phases.slice(TM.i + 1).reduce((t, x) => t + x.dur, 0) + left;
  $('#tvTotal').textContent = `全体の残り ${fmtClock(rest)}`;
}
function finishTimer() {
  clearInterval(TM.iv);
  TM.finished = true;
  SFX.done(); vibrate([300, 100, 300, 100, 500]);
  const ov = $('#timerOverlay');
  ov.className = 'ph-done';
  $('#tvLabel').textContent = 'おつかれさま！';
  $('#tvTime').textContent = '完了';
  $('#tvNext').textContent = `${TM.completed}ラウンド完了`;
  $('#tvRound').textContent = '';
  $('#tvBar').style.width = '100%';
  $('#tvTotal').textContent = '';
  $('#tvBtns').innerHTML = '<button class="tbtn big" data-action="tClose" style="grid-column:1/-1">閉じる</button>';
  TM.opts.onFinish?.(TM.completed, true);
}
function closeTimer() {
  clearInterval(TM.iv);
  TM.phases = [];
  $('#timerOverlay').hidden = true;
  document.body.classList.remove('noscroll');
  releaseLock();
}

        ${inp('pace', '100mあたりの秒数', ex.pace, 'inputmode="decimal" placeholder="距離の種目のみ"')}
      </div>
      <div class="field"><label class="check-row"><input type="checkbox" name="tread" ${ex.calc === 'treadmill' ? 'checked' : ''}>トレッドミルの式で計算（条件1=速度km/h、条件2=傾斜%）</label></div>
      <div class="row2">
        <button type="button" class="btn ghost" data-action="closeModal">キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
      ${isNew ? '' : '<button type="button" class="btn ghost danger block" data-action="delEx" style="margin-top:10px">この種目を削除</button>'}
    </form>`);
}
function saveExerciseForm(form) {
  const f = Object.fromEntries(new FormData(form).entries());
  const name = f.name.trim();
  if (!name) { toast('種目名を入れてください'); return; }
  const cond = (l, u) => l.trim() ? { label: l.trim(), unit: u.trim() } : null;
  const isNew = !modalCtx.exId;
  const ex = isNew ? { id: uid() } : exById(modalCtx.exId);
  Object.assign(ex, {
    name, cat: f.cat, part: f.part, measure: f.measure, tu: f.tu,
    c1: cond(f.c1l, f.c1u), c2: cond(f.c2l, f.c2u),
    mets: parseNum(f.mets) || 4,
    pace: parseNum(f.pace),
    rest: Math.max(0, Math.round(parseNum(f.rest) || 0)),
    calc: f.tread ? 'treadmill' : null,
  });
  const dv = parseNum(f.dv);
  ex.def = { c1: ex.c1 ? parseNum(f.d1) : null, c2: ex.c2 ? parseNum(f.d2) : null, v: dv == null ? null : fromIn(ex, dv) };
  if (isNew) db.exercises.push(ex);
  if (isNew && modalCtx.fromPicker) { addItemToDay(ex.id, state.date); state.view = 'today'; }
  save(); closeModal(); render();
  toast(isNew ? '種目を追加しました' : '種目を保存しました');
}

/* =========================================================
   モーダル
   ========================================================= */
function openModal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  document.body.classList.add('noscroll');
}
function closeModal() {
  const m = $('#modal');
  m.hidden = true; m.innerHTML = '';
  if ($('#timerOverlay').hidden) document.body.classList.remove('noscroll');
}
function formModal({ title, fields, okLabel = '保存', onOk }) {
  modalCtx = { onOk, fields };
  openModal(`<h2>${esc(title)}</h2><form id="mform">
    ${fields.map(f => `<div class="field"><label class="fieldlbl" for="m_${f.key}">${esc(f.label)}</label><input id="m_${f.key}" name="${f.key}" value="${esc(f.value ?? '')}" ${f.num ? 'inputmode="decimal"' : ''} autocomplete="off"></div>`).join('')}
    <div class="row2"><button type="button" class="btn ghost" data-action="closeModal">キャンセル</button><button type="submit" class="btn primary">${esc(okLabel)}</button></div>
  </form>`);
}

/* =========================================================
   クリック操作
   ========================================================= */
const itemOf = el => findItem(el.closest('[data-item]')?.dataset.item);
const A = {
  go: el => go(el.dataset.view),
  dateShift: el => { state.date = addDays(state.date, +el.dataset.n); render(); },
  goToday: () => { state.date = today(); render(); },
  openDay: el => { state.date = el.dataset.d; go('today'); },
  histMonth: el => { const [y, m] = state.histMonth.split('-').map(Number); state.histMonth = ymd(new Date(y, m - 1 + +el.dataset.n, 1)).slice(0, 7); render(); },

  addItem: () => openPicker(),
  pickCat: el => { state.pickCat = el.dataset.c; $('#pickChips').innerHTML = pickChipsHtml(); $('#pickList').innerHTML = pickListHtml(); },
  pickEx: el => {
    const it = addItemToDay(el.dataset.id, state.date);
    save(); closeModal(); render();
    $(`[data-item="${it.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  toggleSet: el => {
    const it = itemOf(el), idx = +el.closest('.set').dataset.set, s = it.sets[idx], ex = exById(it.exId);
    if (s.done) { s.done = false; s.a = null; }
    else {
      s.a = { ...s.p }; s.done = true;
      unlockAudio();
      if (it.rest > 0 && ex && ex.measure !== 'time') startRest(it.rest);
    }
    save(); rerenderItem(it.id); updateSummary();
  },
  delSet: el => {
    const it = itemOf(el), idx = +el.closest('.set').dataset.set;
    if (it.sets[idx].done && !confirm('実績が入っています。このセットを削除しますか？')) return;
    it.sets.splice(idx, 1); save(); rerenderItem(it.id); updateSummary();
  },
  addSet: el => {
    const it = itemOf(el), ex = exById(it.exId), last = it.sets[it.sets.length - 1];
    const p = last ? { ...last.p } : { c1: ex?.def?.c1 ?? null, c2: ex?.def?.c2 ?? null, v: ex?.def?.v ?? null };
    it.sets.push({ p, a: null, done: false }); save(); rerenderItem(it.id); updateSummary();
  },
  copyPrev: el => {
    const it = itemOf(el), prev = historyOf(it.exId, state.date)[0];
    if (!prev) return;
    if (it.sets.some(s => s.done) && !confirm('入力済みの実績があります。前回の内容で置き換えますか？')) return;
    it.sets = cloneSetsAsPlan(prev.item.sets.filter(s => s.done));
    it.rest = prev.item.rest ?? it.rest;
    save(); rerenderItem(it.id); updateSummary();
    toast('前回の実績を計画に入れました');
  },
  editRest: el => {
    const it = itemOf(el);
    formModal({
      title: '休憩時間', fields: [{ key: 'rest', label: 'セット間の休憩（秒）。0で休憩なし', value: it.rest, num: true }],
      onOk: v => { it.rest = Math.max(0, Math.round(parseNum(v.rest) || 0)); save(); rerenderItem(it.id); updateSummary(); },
    });
  },
  itemMenu: el => {
    const it = itemOf(el), ex = exById(it.exId) || MISSING_EX;
    modalCtx = { itemId: it.id };
    openModal(`<h2>${esc(ex.name)}</h2><div class="menu">
      <button class="btn block" data-action="moveItem" data-d="-1">↑ 上へ移動</button>
      <button class="btn block" data-action="moveItem" data-d="1">↓ 下へ移動</button>
      <button class="btn block" data-action="editRestAfter">この種目の後のレスト${it.restAfter > 0 ? `（${fmtDur(it.restAfter)}）` : ''}</button>
      ${exById(it.exId) ? `<button class="btn block" data-action="editEx" data-id="${it.exId}">種目の設定を編集</button>` : ''}
      <button class="btn block danger" data-action="delItem">この種目を今日の計画から外す</button>
      <button class="btn block ghost" data-action="closeModal">閉じる</button></div>`);
  },
  editRestAfter: () => {
    const it = findItem(modalCtx.itemId);
    formModal({
      title: 'この種目の後のレスト', fields: [{ key: 'm', label: '分（サーキットの区切りなど。0でなし）', value: it.restAfter ? r2(it.restAfter / 60) : 0, num: true }],
      onOk: v => { it.restAfter = Math.max(0, Math.round((parseNum(v.m) || 0) * 60)); save(); rerenderItem(it.id); },
    });
  },
  restAfterStart: el => { const it = itemOf(el); unlockAudio(); startRest(it.restAfter); },
  importText: () => openImport(),
  impApply: () => applyImport(),
  moveItem: el => {
    const s = sessionOf(state.date), i = s.items.findIndex(x => x.id === modalCtx.itemId), j = i + +el.dataset.d;
    if (j < 0 || j >= s.items.length) { closeModal(); return; }
    [s.items[i], s.items[j]] = [s.items[j], s.items[i]];
    save(); closeModal(); render();
  },
  delItem: () => {
    const s = sessionOf(state.date), it = s.items.find(x => x.id === modalCtx.itemId);
    if (it?.sets.some(x => x.done) && !confirm('実績が入っています。削除しますか？')) return;
    s.items = s.items.filter(x => x.id !== modalCtx.itemId);
    if (!s.items.length && !s.note) db.sessions = db.sessions.filter(x => x !== s);
    save(); closeModal(); render();
  },
  itemTimer: el => {
    const it = itemOf(el), ex = exById(it.exId), phases = [{ type: 'prep', dur: 10 }];
    const sets = it.sets.filter(s => !s.done);
    if (!sets.length) { toast('すべてのセットが完了しています'); return; }
    sets.forEach((s, i) => {
      phases.push({ type: 'work', dur: s.p.v || 0, round: i + 1, rounds: sets.length, sets: 1 });
      if (i < sets.length - 1 && it.rest > 0) phases.push({ type: 'rest', dur: it.rest, round: i + 1, rounds: sets.length, sets: 1 });
    });
    const itemId = it.id, date = state.date;
    startTimer(phases, {
      title: ex.name,
      onFinish: n => {
        const item = sessionOf(date)?.items.find(x => x.id === itemId);
        if (!item || n <= 0) return;
        item.sets.filter(s => !s.done).slice(0, n).forEach(s => { s.a = { ...s.p }; s.done = true; });
        save();
        if (state.view === 'today' && state.date === date) render();
        toast(`${n}セットを実績に記録しました`);
      },
    });
  },
  copyDay: () => {
    const list = db.sessions.filter(s => s.date !== state.date && s.items.length).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
    openModal(`<h2>どの日のメニューをコピーしますか？</h2>
      <p class="small muted" style="margin-bottom:10px">実績がある日は実績を、ない日は計画を、${fmtDate(state.date)}の計画として追加します。</p>
      ${list.length ? list.map(s => `<button class="pickrow" data-action="copyFrom" data-id="${s.id}"><span>${fmtDateLong(s.date)}</span><small>${esc(s.items.map(i => (exById(i.exId) || MISSING_EX).name).slice(0, 3).join('、'))}${s.items.length > 3 ? ' ほか' : ''}</small></button>`).join('') : '<p class="muted">コピーできる日がありません</p>'}
      <button class="btn block ghost" data-action="closeModal" style="margin-top:8px">閉じる</button>`);
  },
  copyFrom: el => {
    const src = db.sessions.find(s => s.id === el.dataset.id), dst = ensureSession(state.date);
    src.items.forEach(it => dst.items.push({ id: uid(), exId: it.exId, rest: it.rest, restAfter: it.restAfter || 0, sets: cloneSetsAsPlan(it.sets) }));
    save(); closeModal(); render(); toast(`${fmtDate(src.date)}のメニューをコピーしました`);
  },
  deleteDay: () => {
    if (!confirm(`${fmtDateLong(state.date)}の計画と実績をすべて削除しますか？`)) return;
    db.sessions = db.sessions.filter(s => s.date !== state.date); save(); render();
  },

  recType: el => { state.rec.type = el.dataset.t; state.rec.items = null; render(); },
  recGen: () => { generateRec(); render(); },
  recApply: () => {
    const r = state.rec, s = ensureSession(r.date);
    r.items.forEach(it => s.items.push({ id: uid(), exId: it.exId, rest: it.rest, sets: it.sets.map(x => ({ p: { ...x.p }, a: null, done: false })) }));
    if (r.type === 'hyrox' && !s.note.includes('HYROX')) s.note = (s.note ? s.note + '\n' : '') + 'HYROX 合計タイム：';
    save(); state.date = r.date; r.items = null; go('today'); toast('計画に追加しました');
  },

  statsMode: el => { state.statsMode = el.dataset.m; render(); },

  tStep: el => { const k = el.dataset.k; setTimerCfg(k, db.settings.timer[k] + +el.dataset.d); $(`[data-tk="${k}"]`).value = db.settings.timer[k]; $('#tTotal').textContent = fmtDur(timerTotal(db.settings.timer)); },
  tPreset: el => {
    const p = (el.dataset.src === 'b' ? TIMER_PRESETS : db.settings.presets)[+el.dataset.i];
    const { name, ...cfg } = p;
    db.settings.timer = { ...db.settings.timer, ...cfg }; save(); render(); toast(`「${name}」を読み込みました`);
  },
  tDelPreset: el => { db.settings.presets.splice(+el.dataset.i, 1); save(); render(); },
  tSavePreset: () => {
    const c = db.settings.timer;
    formModal({
      title: 'タイマー設定を保存', okLabel: '保存',
      fields: [{ key: 'name', label: '名前', value: `${c.work}/${c.rest}×${c.rounds}${c.sets > 1 ? `×${c.sets}セット` : ''}` }],
      onOk: v => { db.settings.presets.push({ name: v.name.trim() || '自分の設定', ...db.settings.timer }); save(); render(); },
    });
  },
  tStart: () => startTimer(timerPhases(db.settings.timer), { title: 'インターバル' }),
  tPause: () => {
    if (TM.paused) { TM.endAt = Date.now() + TM.left; TM.paused = false; $('#tvPause').textContent = '一時停止'; }
    else { TM.left = TM.endAt - Date.now(); TM.paused = true; $('#tvPause').textContent = '再開'; }
  },
  tSkip: () => {
    TM.i++;
    if (TM.i >= TM.phases.length) { finishTimer(); return; }
    const p = TM.phases[TM.i];
    TM.endAt = Date.now() + p.dur * 1000; TM.left = p.dur * 1000; TM.lastCount = null;
    phaseCue(p); paintPhase(); paintTime(p.dur);
  },
  tStop: () => {
    const n = TM.completed, cb = TM.opts.onFinish;
    closeTimer();
    if (cb && n > 0) cb(n, false);
  },
  tClose: () => closeTimer(),
  soundTest: () => { unlockAudio(); SFX.work(); setTimeout(SFX.count, 700); setTimeout(SFX.rest, 1100); vibrate(200); },
  restAdd: () => { RB.endAt += 15000; RB.dur += 15; restTick(); },
  restSkip: () => stopRest(),

  addWeight: () => {
    const kg = parseNum($('#wInput').value);
    if (!kg || kg < 20 || kg > 300) { toast('体重を正しく入れてください'); return; }
    const d = today();
    db.settings.weights = db.settings.weights.filter(w => w.date !== d);
    db.settings.weights.push({ date: d, kg }); save(); render(); toast('体重を記録しました');
  },
  delWeight: el => { db.settings.weights = db.settings.weights.filter(w => w.date !== el.dataset.d); save(); render(); },
  editEx: el => exerciseForm(exById(el.dataset.id), false),
  newEx: el => exerciseForm(null, el.dataset.from === 'picker'),
  delEx: () => {
    const id = modalCtx.exId;
    if (db.sessions.some(s => s.items.some(i => i.exId === id))) { toast('記録で使われている種目は削除できません'); return; }
    if (!confirm('この種目を削除しますか？')) return;
    if (DEFAULT_EXERCISES.some(e => e.id === id)) db.removedDefaults.push(id);
    db.exercises = db.exercises.filter(e => e.id !== id); save(); closeModal(); render();
  },
  exportData: () => {
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `training-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  importData: () => $('#importFile').click(),
  resetData: () => {
    if (!confirm('すべての記録と設定を削除します。元に戻せません。よろしいですか？')) return;
    db = fresh(); save(); render(); toast('データを削除しました');
  },
  closeModal: () => closeModal(),
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = A[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('.in[data-f]')) return onSetInput(el);
  if (el.matches('[data-input="note"]')) { const s = ensureSession(state.date); s.note = el.value; save(); return; }
  if (el.matches('[data-input="memo"]')) { const it = itemOf(el); if (it) { it.memo = el.value; save(); } return; }
  if (el.id === 'impText') { renderImportPreview(); return; }
  if (el.id === 'exSearch') { $('#pickList').innerHTML = pickListHtml(); return; }
  if (el.matches('[data-tk]')) { const v = parseNum(el.value); if (v != null) { setTimerCfg(el.dataset.tk, v); $('#tTotal').textContent = fmtDur(timerTotal(db.settings.timer)); } return; }
  if (el.dataset.setting === 'volume') { db.settings.volume = +el.value; save(); return; }
  if (el.dataset.setting === 'secPerRep') { const v = parseNum(el.value); if (v > 0) { db.settings.secPerRep = v; save(); } return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'datePick' && el.value) { state.date = el.value; render(); }
  else if (el.id === 'recDate' && el.value) { state.rec.date = el.value; generateRec(); render(); }
  else if (el.id === 'statsEx') { state.statsEx = el.value; drawStatsCharts(); }
  else if (el.matches('[data-tk]')) el.value = db.settings.timer[el.dataset.tk];
  else if (el.dataset.setting === 'vibrate') { db.settings.vibrate = el.checked; save(); }
  else if (el.dataset.setting === 'volume') { unlockAudio(); SFX.count(); }
  else if (el.id === 'importFile' && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!Array.isArray(d.exercises) || !Array.isArray(d.sessions)) throw new Error('format');
        if (!confirm('今のデータを読み込んだデータで置き換えます。よろしいですか？')) return;
        db = migrate(d); save(); render(); toast('読み込みました');
      } catch (err) { toast('このファイルは読み込めません'); }
      finally { el.value = ''; }
    };
    reader.readAsText(el.files[0]);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'exForm') return saveExerciseForm(e.target);
  if (e.target.id === 'mform') {
    const vals = Object.fromEntries(new FormData(e.target).entries());
    const cb = modalCtx.onOk;
    closeModal();
    cb?.(vals);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  // 入力欄で Enter を押したら次の入力欄へ
  if (e.key === 'Enter' && e.target.matches('.in')) {
    e.preventDefault();
    const all = $$('.in'), i = all.indexOf(e.target);
    if (all[i + 1]) all[i + 1].focus(); else e.target.blur();
  }
});
document.addEventListener('click', e => { if (e.target.id === 'datePick') { try { e.target.showPicker(); } catch (err) { /* 非対応 */ } } }, true);

render();
</script>
